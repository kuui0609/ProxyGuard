name: 报告问题
description: 工具没解决问题，或者改了你不想改的东西
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        麻烦把体检报告填上，剩下的能填就填。

        这类工具的问题基本都和具体环境有关，没有体检报告的话只能靠猜。
        双击 `一键体检.cmd` 就能拿到它，只读不写，跑一下没风险。

  - type: textarea
    id: health-report
    attributes:
      label: 体检报告
      description: 双击 一键体检.cmd，把输出整段贴进来
      render: text
      placeholder: |
        [1] 系统代理(当前用户) : ...
        [2] 自动配置脚本(PAC)  : ...
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      description: Win+R 输入 winver 能看到
      placeholder: 比如 Windows 11 24H2 (26100.1234)
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: 用的什么客户端，什么版本
      placeholder: 比如 Watt Toolkit 3.0.0 / Clash Verge Rev 2.0.3
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现的
      placeholder: |
        1. 打开 XXX 开启加速
        2. 直接关机
        3. 开机后浏览器打不开网页
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你本来期望发生什么
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 内容在 %LOCALAPPDATA%\ProxyGuard\logs\proxyguard.log
      render: text
    validations:
      required: false

  - type: dropdown
    id: admin
    attributes:
      label: 是用哪种方式装的
      options:
        - 安装.cmd（普通权限）
        - 安装为计划任务(需管理员).cmd
        - 记不清了
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认一下
      options:
        - label: 我看过 README 里的常见问题和"已知不处理的"，这个问题不在里面
          required: true
